name: Extract Game Assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check ZIP
        run: |
          echo "Danh sach file:"
          ls -lah
          echo "Tim file ZIP:"
          find . -maxdepth 1 -type f -name "*.zip" -print

      - name: Extract assets
        run: |
          rm -rf assets
          mkdir -p assets
          python -m zipfile -e tiem_tra_xinh_assets_v2.zip assets

      - name: Remove ZIP
        run: rm -f tiem_tra_xinh_assets_v2.zip

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git add -u
          git commit -m "Add Tiệm Trà Xinh game assets" || echo "No changes"
          git push
