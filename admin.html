<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiệm Trà Xinh — Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7e8;color:#4b321d}.wrap{width:min(980px,94vw);margin:30px auto}.card{background:#fff;border:1px solid #e7c98d;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #7d5a2510}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid label{font-size:12px;font-weight:700}.grid input{width:100%;padding:9px;border:1px solid #d8c3a0;border-radius:9px;margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e6a72e;color:#fff}.secondary{background:#eee1ca;color:#5c4124}.danger{background:#d85b47}.row{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:12px;color:#876f55}.msg{font-weight:700;margin:8px 0}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="card"><h1>👑 Quản trị Tiệm Trà Xinh</h1><p class="mini">Quản lý hồ sơ và tiến trình từng user trên thiết bị hiện tại.</p><div id="login"><input id="code" type="password" placeholder="Mã Admin" style="padding:11px;border:1px solid #d8c3a0;border-radius:9px"><button class="btn" onclick="login()">Đăng nhập Admin</button><div id="msg" class="msg"></div></div><div id="panel" class="hidden"><div class="row"><button class="btn" onclick="exportDB()">📤 Xuất Users</button><button class="btn secondary" onclick="importDB()">📥 Nhập Users</button><button class="btn secondary" onclick="location.href='index.html'">🎮 Vào game</button></div><div id="users"></div></div></div></main><script>
const KEY='TTX_USER_DB_V1';const ACC='TTX_ACCOUNTS_V1';const ADMIN='SynDepTrai';
function db(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function saveDB(x){localStorage.setItem(KEY,JSON.stringify(x))}
function login(){if(document.getElementById('code').value!==ADMIN){document.getElementById('msg').textContent='⛔ Mã Admin không đúng';return}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function render(){const d=db(),box=document.getElementById('users'),ks=Object.keys(d);if(!ks.length){box.innerHTML='<div class="card">Chưa có user.</div>';return}box.innerHTML=ks.map(u=>{const r=d[u]||{},p=r.progress||{};return `<div class="card"><h3>👤 ${esc(r.displayName||u)} <span class="mini">@${esc(u)}</span></h3><div class="grid"><label>Tiền<input data-u="${esc(u)}" data-f="cash" type="number" value="${Number(p.cash||0)}"></label><label>Cấp<input data-u="${esc(u)}" data-f="level" type="number" value="${Number(p.level||1)}"></label><label>XP<input data-u="${esc(u)}" data-f="xp" type="number" value="${Number(p.xp||0)}"></label><label>⭐ Sao<input data-u="${esc(u)}" data-f="rating" type="number" min="0" max="5" step="0.1" value="${Number(p.rating||0)}"></label><label>Ngày<input data-u="${esc(u)}" data-f="day" type="number" value="${Number(p.day||1)}"></label><label>Chuỗi<input data-u="${esc(u)}" data-f="companyLevel" type="number" value="${Number(p.companyLevel||p.level||1)}"></label></div><div class="row" style="margin-top:9px"><button class="btn" onclick="saveUser('${esc(u)}')">💾 Lưu</button><button class="btn danger" onclick="delUser('${esc(u)}')">🗑️ Xóa</button></div><div class="mini">Tạo: ${r.createdAt?new Date(r.createdAt).toLocaleString():'—'} · Lưu cuối: ${r.lastSavedAt?new Date(r.lastSavedAt).toLocaleString():'—'}</div></div>`}).join('')}
function saveUser(u){const d=db(),r=d[u];if(!r)return;const p=Object.assign({},r.progress||{});document.querySelectorAll('[data-u="'+CSS.escape(u)+'"]').forEach(e=>p[e.dataset.f]=Number(e.value)||0);p.level=Math.max(1,Math.floor(p.level||1));p.companyLevel=Math.max(1,Math.floor(p.companyLevel||p.level));p.xp=Math.max(0,Math.floor(p.xp||0));p.cash=Math.max(0,Math.floor(p.cash||0));p.globalCash=p.cash;p.day=Math.max(1,Math.floor(p.day||1));p.rating=Math.max(0,Math.min(5,Number(p.rating)||0));r.progress=p;r.lastSavedAt=Date.now();d[u]=r;saveDB(d);try{const a=JSON.parse(localStorage.getItem(ACC)||'{}');if(a[u]){a[u].displayName=r.displayName||a[u].displayName;localStorage.setItem(ACC,JSON.stringify(a))}}catch(e){}render()}
function delUser(u){if(!confirm('Xóa toàn bộ dữ liệu @'+u+'?'))return;const d=db();delete d[u];saveDB(d);try{const a=JSON.parse(localStorage.getItem(ACC)||'{}');delete a[u];localStorage.setItem(ACC,JSON.stringify(a))}catch(e){}render()}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db(),null,2)],{type:'application/json'}));a.download='tiem-tra-xinh-users.json';a.click()}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text());saveDB(x);render()}catch(e){alert('File JSON không hợp lệ')}};i.click()}
</script></body></html>
