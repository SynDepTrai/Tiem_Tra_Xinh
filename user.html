<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiệm Trà Xinh - Tài khoản</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff8e8,#ffe6b8);min-height:100vh;display:grid;place-items:center;color:#4b321d}.wrap{width:min(440px,92vw)}.brand{text-align:center;margin-bottom:16px}.brand .icon{font-size:64px}.brand h1{margin:4px 0;font-size:30px}.brand p{margin:4px 0;color:#80684f}.card{background:#fffdf8;border:2px solid #efc36d;border-radius:20px;padding:22px;box-shadow:0 12px 35px #7d5a251c}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tab{border:0;border-radius:12px;padding:12px;font-weight:800;background:#f5ead4;color:#6b4b2a;cursor:pointer}.tab.active{background:#e8a934;color:white}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #d8c3a0;border-radius:11px;font-size:16px;outline:none}.field input:focus{border-color:#e3a72f;box-shadow:0 0 0 3px #e3a72f22}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;background:#e6a72e;color:#fff;margin-top:8px}.btn.secondary{background:#f0e4cf;color:#654522}.hint{font-size:13px;color:#876f55;line-height:1.5;margin-top:12px}.msg{min-height:22px;margin:10px 0;font-weight:700}.accountList{margin-top:18px;border-top:1px dashed #d7bf98;padding-top:14px}.account{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff7e8;border-radius:11px;padding:10px;margin:7px 0}.small{font-size:12px;color:#8a7357}.danger{background:#e46b4e}.hidden{display:none!important}
</style></head><body><main class="wrap">
<div class="brand"><div class="icon">🧋</div><h1>Tiệm Trà Xinh</h1><p>Tài khoản người chơi · lưu tiến trình riêng</p></div>
<div class="card">
<div class="tabs"><button id="loginTab" class="tab active" onclick="showTab('login')">Đăng nhập</button><button id="registerTab" class="tab" onclick="showTab('register')">Tạo tài khoản</button></div>
<section id="loginBox"><div class="field"><label>Tài khoản</label><input id="loginUser" autocomplete="username" placeholder="Ví dụ: hieu"></div><div class="field"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"></div><div id="loginMsg" class="msg"></div><button class="btn" onclick="login()">🔐 Đăng nhập & chơi</button></section>
<section id="registerBox" class="hidden"><div class="field"><label>Tên hiển thị</label><input id="regName" maxlength="24" placeholder="Ví dụ: Khắc Hiếu"></div><div class="field"><label>Tài khoản</label><input id="regUser" maxlength="32" autocomplete="username" placeholder="Ví dụ: hieu2004"></div><div class="field"><label>Mật khẩu</label><input id="regPass" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự"></div><div class="field"><label>Nhập lại mật khẩu</label><input id="regPass2" type="password" autocomplete="new-password"></div><div id="regMsg" class="msg"></div><button class="btn" onclick="register()">✨ Tạo tài khoản</button></section>
<div class="hint">Dữ liệu tài khoản được lưu trên trình duyệt của thiết bị này. Tài khoản/mật khẩu ở đây là hệ thống tài khoản <b>local</b> của game, không phải máy chủ online; xóa dữ liệu trình duyệt sẽ xóa tài khoản nếu chưa sao lưu.</div>
<div id="accounts" class="accountList"></div>
</div></main>
<script>
const ACC_KEY='TTX_ACCOUNTS_V1'; const SESSION_KEY='TTX_ACCOUNT_SESSION';
function accounts(){try{return JSON.parse(localStorage.getItem(ACC_KEY)||'{}')}catch(e){return {}}}
function saveAccounts(a){localStorage.setItem(ACC_KEY,JSON.stringify(a))}
async function hash(v){const data=new TextEncoder().encode(v);const buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function cleanUser(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_-]/g,'').slice(0,32)}
function showTab(which){const login=which==='login';document.getElementById('loginBox').classList.toggle('hidden',!login);document.getElementById('registerBox').classList.toggle('hidden',login);document.getElementById('loginTab').classList.toggle('active',login);document.getElementById('registerTab').classList.toggle('active',!login);document.getElementById('loginMsg').textContent='';document.getElementById('regMsg').textContent=''}
function goGame(){location.href='index.html'}
async function register(){const name=document.getElementById('regName').value.trim().replace(/\s+/g,' ').slice(0,24);const user=cleanUser(document.getElementById('regUser').value);const p=document.getElementById('regPass').value,p2=document.getElementById('regPass2').value;const msg=document.getElementById('regMsg');if(name.length<2)return msg.textContent='❌ Tên hiển thị phải có ít nhất 2 ký tự';if(user.length<3)return msg.textContent='❌ Tài khoản phải có ít nhất 3 ký tự';if(p.length<6)return msg.textContent='❌ Mật khẩu phải có ít nhất 6 ký tự';if(p!==p2)return msg.textContent='❌ Mật khẩu nhập lại không khớp';const a=accounts();if(a[user])return msg.textContent='❌ Tài khoản đã tồn tại';a[user]={username:user,displayName:name,passwordHash:await hash(p),createdAt:Date.now(),version:1};saveAccounts(a);localStorage.setItem(SESSION_KEY,JSON.stringify({username:user,displayName:name,loggedAt:Date.now()}));msg.textContent='✅ Tạo tài khoản thành công';setTimeout(goGame,250)}
async function login(){const user=cleanUser(document.getElementById('loginUser').value),p=document.getElementById('loginPass').value,msg=document.getElementById('loginMsg');const a=accounts(),acc=a[user];if(!acc)return msg.textContent='❌ Sai tài khoản hoặc mật khẩu';if((await hash(p))!==acc.passwordHash)return msg.textContent='❌ Sai tài khoản hoặc mật khẩu';localStorage.setItem(SESSION_KEY,JSON.stringify({username:user,displayName:acc.displayName||user,loggedAt:Date.now()}));msg.textContent='✅ Đăng nhập thành công';setTimeout(goGame,150)}
function renderAccounts(){const box=document.getElementById('accounts'),a=accounts(),keys=Object.keys(a);if(!keys.length){box.innerHTML='<div class="small">Chưa có tài khoản trên thiết bị này.</div>';return}box.innerHTML='<b>Tài khoản trên thiết bị</b>'+keys.map(k=>`<div class="account"><div><b>${a[k].displayName||k}</b><div class="small">@${k}</div></div><button class="btn secondary" style="width:auto;margin:0;padding:8px 10px" onclick="quick('${k.replace(/'/g,"\\'")}')">Chọn</button></div>`).join('')}
function quick(u){showTab('login');document.getElementById('loginUser').value=u;document.getElementById('loginPass').focus()}
(function(){try{const raw=localStorage.getItem(SESSION_KEY);if(raw){const s=JSON.parse(raw);if(s?.username){location.replace('index.html');return}}}catch(e){}renderAccounts()})();
</script></body></html>
